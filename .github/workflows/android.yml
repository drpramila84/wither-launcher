name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" --sdk_root=$ANDROID_SDK_ROOT

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache downloaded build assets
        uses: actions/cache@v4
        with:
          path: |
            app_pojavlauncher/build/intermediates/download_deps
          key: build-assets-${{ hashFiles('app_pojavlauncher/build.gradle') }}
          restore-keys: build-assets-

      - name: Give Gradle permission
        run: chmod +x gradlew

      - name: Update language list
        run: bash scripts/languagelist_updater.sh

      - name: Build Full Debug APK
        run: ./gradlew :app_pojavlauncher:assembleFullDebug --warning-mode=none

      - name: Build NoRuntime Debug APK
        run: ./gradlew :app_pojavlauncher:assembleNoruntimeDebug --warning-mode=none

      - name: Collect APKs
        run: |
          mkdir -p out
          find app_pojavlauncher/build/outputs/apk/full/debug -name "*.apk" | \
            xargs -I{} cp {} out/wither-launcher-full.apk
          find app_pojavlauncher/build/outputs/apk/noruntime/debug -name "*.apk" | \
            xargs -I{} cp {} out/wither-launcher-noruntime.apk

      - name: Upload Full APK (includes Java runtime)
        uses: actions/upload-artifact@v4
        with:
          name: wither-launcher-full
          path: out/wither-launcher-full.apk
          retention-days: 30

      - name: Upload NoRuntime APK
        uses: actions/upload-artifact@v4
        with:
          name: wither-launcher-noruntime
          path: out/wither-launcher-noruntime.apk
          retention-days: 30

      - name: Get version name
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: version
        run: |
          VERSION=$(./gradlew -q :app_pojavlauncher:printVersionName 2>/dev/null || \
            echo "build-$(date +%Y%m%d)-$(git rev-parse --short HEAD)")
          echo "name=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} (${{ github.sha }})"
          body: |
            Automated build from commit ${{ github.sha }}

            **Full APK** — includes the Java runtime, install and play directly.
            **NoRuntime APK** — smaller download, requires Java runtime to be installed separately.

            ### Changes
            ${{ github.event.head_commit.message }}
          files: |
            out/wither-launcher-full.apk
            out/wither-launcher-noruntime.apk
          draft: false
          prerelease: false
